name: Develop

# A build to try before a release, signed with the release key: it installs over a released Lumbina
# and keeps its settings. Its version is the release's with "-dev.<run>.<commit>" after it, so the
# device is offered the next release and not this one again. Kept as the run's artifact, not
# published.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LUMBINA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "LUMBINA_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      # As a release has them: a build of other process names would not replace a released one cleanly.
      - name: Check the process prefix
        env:
          LUMBINA_PROCESS_PREFIX: ${{ secrets.LUMBINA_PROCESS_PREFIX }}
        run: test -n "$LUMBINA_PROCESS_PREFIX" || { echo "LUMBINA_PROCESS_PREFIX secret is missing"; exit 1; }

      - name: Test and build
        env:
          LUMBINA_KEYSTORE_FILE: release.keystore
          LUMBINA_KEYSTORE_PASSWORD: ${{ secrets.LUMBINA_KEYSTORE_PASSWORD }}
          LUMBINA_KEY_ALIAS: ${{ secrets.LUMBINA_KEY_ALIAS }}
          LUMBINA_KEY_PASSWORD: ${{ secrets.LUMBINA_KEY_PASSWORD }}
          LUMBINA_PROCESS_PREFIX: ${{ secrets.LUMBINA_PROCESS_PREFIX }}
        run: |
          ./gradlew checkModuleGraph test testDebugUnitTest testFossDebugUnitTest :app:assembleFossRelease \
            "-Plumbina.versionSuffix=-dev.${GITHUB_RUN_NUMBER}.${GITHUB_SHA::7}"

      - name: Collect the package
        run: |
          mkdir dist
          name="lumbina-dev.${GITHUB_RUN_NUMBER}.${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/foss/release/*.apk "dist/$name"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          echo "NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: dist/*
          retention-days: 30
